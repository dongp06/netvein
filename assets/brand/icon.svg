<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>

    <!-- Card Rim Stroke -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Main N Vein Ribbon Gradients -->
    <linearGradient id="leftPillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="diagonalVein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="rightPillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Core Vein Filament Gradient -->
    <linearGradient id="pulseCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="none" stroke="url(#rimGrad)" stroke-width="2"/>

  <!-- Subtle Radial Backlight behind the glyph -->
  <circle cx="256" cy="256" r="180" fill="#0284c7" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="140" fill="#7c3aed" opacity="0.10" filter="url(#softGlow)"/>

  <!-- Background Cyber Circuit Grid Lines (Subtle) -->
  <g stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.45">
    <line x1="80" y1="140" x2="432" y2="140"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="372" x2="432" y2="372"/>
    <line x1="140" y1="80" x2="140" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="372" y1="80" x2="372" y2="432"/>
  </g>

  <!-- Glowing Vein Silhouette (Glow pass) -->
  <g opacity="0.35" filter="url(#softGlow)">
    <path d="M148 376 L148 136 L364 376 L364 136" fill="none" stroke="url(#diagonalVein)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Monogram "N" (Solid primary pass) -->
  <!-- Left Pillar -->
  <path d="M148 376 L148 136" fill="none" stroke="url(#leftPillar)" stroke-width="48" stroke-linecap="round"/>

  <!-- Diagonal Vein Conduit -->
  <path d="M148 136 L364 376" fill="none" stroke="url(#diagonalVein)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Pillar -->
  <path d="M364 376 L364 136" fill="none" stroke="url(#rightPillar)" stroke-width="48" stroke-linecap="round"/>

  <!-- High-Tech Core Filament (Glowing Inner Track) -->
  <path d="M148 360 L148 152 L364 360 L364 152" fill="none" stroke="url(#pulseCore)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Precision Digital Circuit Junction Nodes (Embedded on the glyph spine) -->
  <!-- Top-Left Origin Node -->
  <circle cx="148" cy="136" r="14" fill="#082f49" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="148" cy="136" r="6" fill="#ffffff" filter="url(#nodeGlow)"/>

  <!-- Mid-Pulse Node on Diagonal -->
  <circle cx="256" cy="256" r="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="3"/>
  <circle cx="256" cy="256" r="5" fill="#67e8f9" filter="url(#nodeGlow)"/>

  <!-- Bottom-Right Terminal Node -->
  <circle cx="364" cy="376" r="14" fill="#3b0764" stroke="#c084fc" stroke-width="3"/>
  <circle cx="364" cy="376" r="6" fill="#ffffff" filter="url(#nodeGlow)"/>
</svg>
